services:
  train:
    build:
      context: .
      dockerfile: Dockerfile.train
    image: iris-train:opt
    volumes:
      - models:/models
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.infer
    image: iris-infer:opt
    depends_on:
      train:
        condition: service_completed_successfully
      base:
        condition: service_healthy
    environment:
      - REDIS_HOST=base
      - REDIS_PORT=6379
    volumes:
      - models:/models:ro
    ports:
      - "8000:8000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  base:
    image: redis:7-alpine
    volumes:
      - donnees:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  models:
  donnees: